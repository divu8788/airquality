name: Deploy to VM

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ✅ ADD THIS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: SSH Deploy
      uses: appleboy/ssh-action@v1.0.3   # ✅ upgrade version
      with:
        host: 4.235.112.189
        username: azureuser
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd air-quality-ml
          git pull
          pkill gunicorn || true
          nohup gunicorn -w 4 -b 0.0.0.0:8080 run:app &